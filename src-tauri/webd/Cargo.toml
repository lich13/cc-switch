[package]
name = "cc-switch-webd"
version = "3.16.5"
description = "Headless WebUI daemon for CC Switch"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/lich13/cc-switch"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
anyhow = "1.0"
cc-switch = { path = ".." }
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
