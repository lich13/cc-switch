name: Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.SYNC_PAT || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream main --tags
          git checkout -B chore/sync-upstream origin/main
          git merge --no-edit upstream/main
          # Compare trees, not history ranges. origin/main already includes our fork-only
          # release/version changes, so triple-dot would report them as "changed" forever.
          if git diff --quiet origin/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: git push --force-with-lease origin chore/sync-upstream

      - name: Create or update pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.SYNC_PAT || github.token }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          cat > "$body_file" <<'BODY'
          Automated sync from `farion1231/cc-switch` into this fork.

          If this PR has conflicts, resolve them by keeping fork-specific pure local route and release configuration changes while taking upstream bug fixes.
          BODY
          existing="$(gh pr list --head chore/sync-upstream --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$existing" \
              -f title="chore: sync upstream cc-switch" \
              -F body=@"$body_file"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f base=main \
              -f head=chore/sync-upstream \
              -f title="chore: sync upstream cc-switch" \
              -F body=@"$body_file"
          fi

      - name: Setup Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        if: steps.merge.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install frontend dependencies
        if: steps.merge.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        if: steps.merge.outputs.changed == 'true'
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm test:unit

      - name: Setup Rust
        if: steps.merge.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Backend checks
        if: steps.merge.outputs.changed == 'true'
        run: |
          mkdir -p dist
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
