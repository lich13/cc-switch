# Example HTTPS reverse proxy for the management WebUI under /cc-switch/.
# Replace server_name and ssl_certificate paths before enabling.
server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 1m;

    # Do not expose the model proxy API on the public management domain.
    location ^~ /cc-switch/v1/ {
        return 404;
    }

    location = /cc-switch {
        return 308 /cc-switch/;
    }

    location ^~ /cc-switch/ {
        proxy_pass http://127.0.0.1:15722/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
